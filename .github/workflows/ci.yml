name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m mypy src/reelpilot
      - run: python -m pytest -q
      - run: cargo test --manifest-path native/reelpilot-input/Cargo.toml
      - run: cargo clippy --manifest-path native/reelpilot-input/Cargo.toml -- -D warnings
