[package]
name = "reelpilot-input"
version = "0.1.0-beta.2"
edition = "2024"
license = "MIT"
description = "Fail-safe Windows mouse timing helper for ReelPilot"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = true
