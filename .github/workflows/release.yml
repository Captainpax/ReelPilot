name: Windows prerelease

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - run: .\scripts\build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: ReelPilot-windows-x64
          path: |
            dist/ReelPilot-v*-windows-x64.zip
            dist/SHA256SUMS.txt
      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Get-ChildItem dist/ReelPilot-v*-windows-x64.zip -File -ErrorAction Stop
          if ($archive.Count -ne 1) {
            throw "Expected exactly one Windows archive, found $($archive.Count)."
          }
          gh release create $env:GITHUB_REF_NAME `
            $archive.FullName `
            dist/SHA256SUMS.txt `
            --prerelease `
            --generate-notes `
            --title "ReelPilot $env:GITHUB_REF_NAME"
